name: Taiwan Data Quality Tests

on:
  push:
    branches:
      - maintenance/data-integrity-2026-11-12
      - maintenance/refresh-lagging-and-ohlc-audit-2026-11-12
      - maintenance/fix-latest-observed-nameerror-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-tw.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tw.txt

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
