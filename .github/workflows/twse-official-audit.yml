name: TWSE Official Exact-Date Audit

on:
  push:
    branches:
      - maintenance/run-live-twse-audit-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install audit dependency
        run: python -m pip install requests
      - name: Query official TWSE daily bars
        run: python scripts/audit_run19_twse.py
