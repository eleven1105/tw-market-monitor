name: Wave Candidate and Chip Live Validation

on:
  push:
    branches:
      - research/tw-listed-common-stocks
    paths:
      - 'candidate_chip_pipeline.py'
      - '.github/workflows/wave-candidate-live-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-wave-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/tw-listed-common-stocks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Restore Taiwan price history cache
        uses: actions/cache@v4
        with:
          path: |
            data/tw-share/dayK
            data/tw-share/lists
          key: ${{ runner.os }}-tw-listed-common-live-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-tw-listed-common-
      - name: Restore FinMind chip cache
        uses: actions/cache@v4
        with:
          path: data/tw-share/chip_cache
          key: ${{ runner.os }}-tw-chip-cache-live-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-tw-chip-cache-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tw.txt
      - name: Compile and unit tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Run bounded live candidate and chip enrichment
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python candidate_chip_pipeline.py
      - name: Upload live candidate and chip audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-candidate-chip-live-validation
          path: |
            output/wave_candidates.csv
            output/wave_candidate_chip_status.json
          if-no-files-found: warn
