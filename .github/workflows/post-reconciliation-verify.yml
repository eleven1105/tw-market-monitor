name: Post-Reconciliation Taiwan Monitor Verification

on:
  push:
    branches:
      - maintenance/run-reconciled-monitor-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reconciled-market:
    name: Run latest research branch against live Taiwan data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest research branch code
        uses: actions/checkout@v4
        with:
          ref: research/tw-listed-common-stocks

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-tw.txt

      - name: Restore Taiwan price history cache
        uses: actions/cache@v4
        with:
          path: |
            data/tw-share/dayK
            data/tw-share/lists
          key: ${{ runner.os }}-tw-listed-common-reconciled-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-tw-listed-common-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tw.txt

      - name: Validate code before live run
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Run Taiwan listed common-stock monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_RECEIVER_EMAIL: ${{ secrets.REPORT_RECEIVER_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --market tw-share
